
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recreio Imports | Premium Sportswear</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'brand-yellow': '#E6D800',
              'brand-lead': '#374151',
              'brand-naval': '#212A3E',
              'brand-naval-dark': '#141A26',
              'brand-naval-light': '#394867',
              'brand-off-white': '#E5EBF0',
              'brand-surface-light': '#D1D9E0',
              'brand-border-light': '#CAD3DB',
              'brand-burgundy': '#800020',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Orbitron', 'sans-serif'],
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fade-in 0.3s ease-out forwards',
            }
          }
        }
      }
    </script>
    <style>
      /* REMOÇÃO TOTAL DE BARRAS DE ROLAGEM */
      * {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
      
      /* BLOQUEIO ABSOLUTO DO DESLOCAMENTO DO GOOGLE TRANSLATE */
      /* Usamos !important em tudo para vencer os estilos injetados via JS */
      html, body {
        top: 0 !important;
        position: static !important;
        margin-top: 0 !important;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #E5EBF0;
        color: #212A3E;
        transition: background-color 0.3s ease, color 0.3s ease;
        overflow-x: hidden;
      }
      .dark body {
        background-color: #141A26;
        color: #E5EBF0;
      }

      /* OCULTAR BARRA SUPERIOR E ELEMENTOS DE INTERFACE DO GOOGLE */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      .goog-te-banner,
      #goog-gt-tt,
      .goog-te-balloon-frame,
      .goog-te-gadget-icon,
      .skiptranslate > iframe {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
      }

      /* Oculta o widget original mas mantém o motor funcionando */
      #google_translate_element {
        display: none !important;
      }

      /* Estilo do menu de seleção flutuante (Iframe do Google que aparece ao clicar) */
      .goog-te-menu-frame {
        z-index: 99999999 !important;
        box-shadow: 0 16px 32px rgba(0,0,0,0.5) !important;
        border: 1px solid rgba(255,242,0,0.3) !important;
        border-radius: 12px !important;
        top: 80px !important; /* Posiciona abaixo do header */
      }

      /* Proteção especial para a Logo e elementos não traduzíveis */
      .notranslate, .notranslate * {
        translate: no !important;
      }

      .text-outline { -webkit-text-stroke: 1px rgba(255,242,0,0.1); color: transparent; }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.28.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
    <script type="text/javascript">
      // Script para monitorar e impedir que o Google mude o 'top' do body
      const observer = new MutationObserver(() => {
        if (document.body.style.top !== '0px') {
          document.body.style.top = '0px';
        }
        if (document.documentElement.style.top !== '0px') {
          document.documentElement.style.top = '0px';
        }
      });
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
      observer.observe(document.body, { attributes: true, attributeFilter: ['style'] });

      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'pt',
          // Idiomas: Português, Inglês, Espanhol, Italiano, Alemão, Francês
          includedLanguages: 'pt,en,es,it,de,fr',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
  <body>
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
